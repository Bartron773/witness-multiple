<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Department of Impossible Destinations</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#eee;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}small{letter-spacing:.16em;color:#b8c9d3}h1{font:clamp(32px,6vw,66px)/1 Georgia;margin:16px 0}canvas{width:100%;height:auto;display:block;border:1px solid #60717b;border-radius:6px}button,a{color:inherit}button{background:#23343f;border:1px solid #60717b;border-radius:4px;padding:12px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#e8c98e;color:#17232b}button:focus-visible{outline:3px solid white}.stops{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:16px 0}.controls{display:flex;flex-wrap:wrap;gap:8px}.ticket{border:1px dashed #c8a976;padding:18px;margin:24px 0;color:#e8c98e}p{line-height:1.6}footer{margin:24px 0}</style></head><body><main><small>EST. 1982 · NO RETURN REQUIRED</small><h1>The Department of Impossible Destinations</h1><p>One passenger. Six places that don't exist. A complimentary ticket to somewhere else.</p><canvas id="scene" width="1000" height="480" aria-label="Animated imaginary railway landscape"></canvas><div class="stops" id="stops"></div><h2 id="name"></h2><p id="description" aria-live="polite"></p><div class="controls"><button id="depart">Depart now →</button><button id="sky" aria-pressed="false">Night sky</button><button id="sound" aria-pressed="false">Sound on</button></div><div class="ticket"><small>PASSENGER 44 · UNLIMITED DEPARTURES</small><p id="privilege"></p></div><footer><a href="index.html">← Return to FORTY-FOUR</a><p><small>A BIRTHDAY GIFT FROM LINCOLN · 24 XI 2026 · RECONSTRUCTED EDITION</small></p></footer></main><script>
const worlds=[['Cloud City','The City Above the Clouds','A city where the streets are suspended above the weather.','Permission to rise above the ordinary.','#9fc7d5','#f2cda4'],['Hound Island','The Republic of Hounds','Oliver is Minister of Outdoor Affairs. Rain is unconstitutional. Squirrels remain under investigation.','Unlimited walks, no questions asked.','#85b6a2','#f0d49b'],['Escher Station','The Station That Arrives at Itself','Every staircase leads somewhere you have already been, but never quite the same way.','Permission to take the scenic route forever.','#a3a4c8','#e6c6b1'],['Glass Coast','The Coast of Unbuilt Houses','Architecture for lives not yet lived, overlooking a sea of possibilities.','A window in every direction.','#81b5cb','#f5d7b0'],['Horn Valley','The Valley of Invisible Orchestras','French horns and cellos drift between the hills. No orchestra can be seen.','A front-row seat without a seat.','#a99bbd','#e9b5a1'],['Tomorrow','Tomorrow, Without an Appointment','No timetable. No obligations. Just a horizon that belongs to you.','One more year of noticing ordinary things.','#e2a68d','#f6dba6']];
const c=document.querySelector('canvas'),g=c.getContext('2d'),$=id=>document.getElementById(id);let n=0,night=false,px=0,ac,master,voices=[],playing=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function choose(i){n=i;$('name').textContent=worlds[i][1];$('description').textContent=worlds[i][2];$('privilege').textContent=worlds[i][3];[...$('stops').children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i));if(playing) tune()}
worlds.forEach((w,i)=>{let b=document.createElement('button');b.textContent=w[0];b.onclick=()=>choose(i);$('stops').append(b)});$('depart').onclick=()=>choose((n+1)%6);$('sky').onclick=()=>{night=!night;$('sky').setAttribute('aria-pressed',night);$('sky').textContent=night?'Day sky':'Night sky'};c.onpointermove=e=>px=(e.offsetX/c.clientWidth-.5)*24;c.onpointerleave=()=>px=0;
function tune(){voices.forEach((v,i)=>v.frequency.setTargetAtTime([110,164.81,220][i]*Math.pow(2,n/12),ac.currentTime,.5))}
$('sound').onclick=async()=>{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0;master.connect(ac.destination);[0,1,2].forEach(i=>{let o=ac.createOscillator(),a=ac.createGain();o.type=i===1?'triangle':'sine';a.gain.value=.035/(i+1);o.connect(a).connect(master);o.start();voices.push(o)})}await ac.resume();playing=!playing;master.gain.setTargetAtTime(playing?1:0,ac.currentTime,.3);tune();$('sound').textContent=playing?'Sound off':'Sound on';$('sound').setAttribute('aria-pressed',playing)};
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function line(x,y,X,Y,color,w=2){g.strokeStyle=color;g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}
function draw(ms){let t=reduced?0:ms/1000,w=worlds[n],grad=g.createLinearGradient(0,0,0,480);grad.addColorStop(0,night?'#10182f':w[4]);grad.addColorStop(1,night?'#45516c':w[5]);g.fillStyle=grad;g.fillRect(0,0,1000,480);circle(800,95,42,night?'#e7e4ce':'#fff0bf');if(night)for(let i=0;i<45;i++)circle((i*173)%1000,(i*79)%210,1.3,'#fff');for(let j=0;j<3;j++){g.fillStyle=['#697e89','#536b72','#344b53'][j];g.beginPath();g.moveTo(0,480);for(let x=0;x<=1000;x+=10)g.lineTo(x,220+j*52+Math.sin(x*.009+j+px*.015)*48+Math.cos(x*.018+j)*20);g.lineTo(1000,480);g.fill()}
if(n===0){for(let i=0;i<7;i++){let x=100+i*120+px,y=150+Math.sin(i)*35;rect(x,y,55,100,'#e7e5d7');for(let k=0;k<5;k++)rect(x+10,y+10+k*16,35,5,'#8faab7');circle(x+25,y+100,45,'#dce7e7')}}if(n===1){for(let i=0;i<5;i++){let x=100+i*170,y=300+Math.sin(t+i)*4;g.fillStyle='#b8804e';g.beginPath();g.ellipse(x,y,34,15,0,0,7);g.fill();circle(x+32,y-15,14,'#b8804e');circle(x+28,y-8,8,'#744d39');line(x-20,y+8,x-24,y+30,'#b8804e',7);line(x+18,y+8,x+22,y+30,'#b8804e',7);line(x-30,y,x-48,y-20,'#b8804e',5)}}if(n===2){for(let i=0;i<12;i++){rect(180+i*48,320-i*13,65,14,'#d9d4c8');rect(750-i*42,320-i*13,60,10,'#a6a5b9')}}if(n===3){for(let i=0;i<5;i++){let x=100+i*175;rect(x,190,125,120,'#bde2e477');g.strokeStyle='#f0eee0';g.strokeRect(x,190,125,120);line(x,190,x+62,145,'#f0eee0');line(x+62,145,x+125,190,'#f0eee0');line(x+62,190,x+62,310,'#f0eee0')}}if(n===4){for(let i=0;i<7;i++){g.strokeStyle='#f7d6a9aa';g.lineWidth=2;g.beginPath();g.arc(500,250,30+i*35+Math.sin(t+i)*8,Math.PI,2*Math.PI);g.stroke()}}if(n===5){line(0,300,1000,300,'#f9d8a5',3);for(let i=0;i<5;i++)line(500,300,100+i*200,480,'#d9b68b66')}
rect(0,365,1000,115,'#26383e');for(let x=0;x<1000;x+=40)rect(x,408,22,24,'#79695a');rect(0,410,1000,5,'#b9b5a5');rect(0,428,1000,5,'#b9b5a5');let x=reduced?260:((t*75)%1450)-420;for(let i=0;i<3;i++){let X=x+i*132;rect(X,350,125,56,i===0?'#b95642':'#d8c7a0');rect(X+8,358,109,22,'#293e4b');for(let k=1;k<4;k++)rect(X+8+k*27,358,3,22,'#d8c7a0');circle(X+24,407,10,'#12191e');circle(X+100,407,10,'#12191e')}rect(x+10,335,40,17,'#b95642');if(!reduced)for(let i=0;i<5;i++)circle(x+30-i*16,325-i*10,8+i*3,'#ffffff33');requestAnimationFrame(draw)}choose(0);requestAnimationFrame(draw);
</script></body></html>
